plugins {
    id 'com.android.application'
}

// Only configure release signing when a keystore path is actually supplied.
// Without these variables, assembleRelease produces an unsigned APK.
def releaseKeystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace 'com.exambuddy'
    compileSdk 34

    defaultConfig {
        applicationId "com.exambuddy"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt']
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // HTTP Client (OkHttp)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Markdown rendering
    implementation 'io.noties.markwon:core:4.6.2'

    // Coroutines via CompletableFuture (Java 8+)
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Lottie animation
    implementation 'com.airbnb.android:lottie:6.3.0'
}
